[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vorflow"
version = "0.0.2"
description = "Voronoi mesh generation for MODFLOW 6 using Gmsh and Geopandas"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "rhugman", email = "rthugman@gmail.com"},
    {name = "Oscar Sanchez", email = "oscarfasanchez@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "scipy",
    "gmsh",               # The official python SDK
]

[project.urls]
Repository = "https://github.com/oscarfasanchez/vorflow_os"
Issues = "https://github.com/oscarfasanchez/vorflow_os/issues"

[project.optional-dependencies]
examples = [
    "matplotlib",         # Plotting in examples/ and notebooks; the library itself never imports it
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "jupyter",
    "matplotlib",
]

[tool.ruff.lint.per-file-ignores]
# set_verbosity(1) must run before the submodules are imported so their
# loggers inherit the default console behavior.
"src/vorflow/__init__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: gmsh-heavy end-to-end tests (deselect with -m 'not slow')",
]
